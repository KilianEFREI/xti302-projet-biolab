# J1 : fail2ban surveille SSH et bannit les IP qui echouent trop
[sshd]
enabled = true
# Debian 13 a pas de auth.log, fail2ban lit directement le journal
backend = systemd
# 5 echecs en 10 minutes -> IP bannie 30 minutes
maxretry = 5
findtime = 10m
bantime = 30m
# le ban est fait avec nftables (le meme pare-feu que J2)
banaction = nftables
