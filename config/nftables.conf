#!/usr/sbin/nft -f
# J2 : pare-feu du serveur BioLab
# tout ce qui entre est refuse sauf SSH et les connexions deja etablies

# on remplace seulement notre table (pas de "flush ruleset") :
# sinon recharger le pare-feu efface aussi la table de fail2ban et les IP bannies
table inet filter
delete table inet filter

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # la machine peut se parler a elle-meme
        iif "lo" accept
        # reponses aux connexions deja ouvertes (apt, dns...)
        ct state established,related accept
        ct state invalid drop
        # SSH
        tcp dport 22 accept
    }

    chain forward {
        # le serveur fait pas routeur
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
