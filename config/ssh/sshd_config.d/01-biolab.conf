# Durcissement SSH du serveur BioLab
# fichier en 01- pour etre lu en premier (sshd garde la premiere valeur qu'il lit)

# S1 : connexion par cle seulement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

# S2 : pas de connexion root
PermitRootLogin no

# S3 : seuls les membres de acces_ssh peuvent se connecter
AllowGroups acces_ssh

# S4 : 3 essais max par connexion, 30 s pour s'authentifier
MaxAuthTries 3
LoginGraceTime 30
# session sans activite fermee au bout de 15 min
ChannelTimeout session=15m
# client qui repond plus : coupe au bout de 3 x 5 min
ClientAliveInterval 300
ClientAliveCountMax 3

X11Forwarding no

# invites : SFTP seulement, pas de shell ni de tunnel
Match Group invite
    ForceCommand internal-sftp
    PermitTTY no
    AllowTcpForwarding no
    X11Forwarding no
